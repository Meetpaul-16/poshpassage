  <section class="page-hero">

      <p class="eyebrow">FAQ</p>
      <h1>Limousine &amp; Party Bus<br>Questions, Answered.</h1>
      <p class="lede">Everything we get asked most often. Can't find it here? Just call us.</p>

  <section class="section-tight">
    <div class="container" style="max-width:860px;">
      <div class="faq-list">

        <details class="faq-item" open>
          <summary>What areas do you serve?<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></summary>
          <p>We run across Metro Vancouver, the Fraser Valley (including Chilliwack) and the Sea-to-Sky corridor up to Squamish and Whistler. If you're just outside that range, call us — we can often still make it work.</p>
        </details>

        <details class="faq-item">
          <summary>How far in advance should I book?<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></summary>
          <p>As soon as your date is set is always safest — for weddings, proms and other high-season dates we'd suggest a few weeks out if you can. That said, we'll always do what we can for last-minute requests, so don't hesitate to call even if your date is close.</p>
        </details>

        <details class="faq-item">
          <summary>How is pricing determined?<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></summary>
          <p>Pricing depends on distance, hours booked, vehicle type and date. Send us a request or give us a call and we'll put together a straightforward, no-obligation quote.</p>
        </details>

        <details class="faq-item">
          <summary>Do you require a deposit?<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></summary>
          <p>Deposit requirements can vary depending on the event and season. We'll always walk you through exactly what's needed before you commit to anything.</p>
        </details>

        <details class="faq-item">
          <summary>What's your cancellation policy?<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></summary>
          <p>Cancellation terms are confirmed at the time of booking so there are no surprises later — just ask when you reserve and we'll spell it out clearly.</p>
        </details>

        <details class="faq-item">
          <summary>Is gratuity included?<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></summary>
          <p>Not automatically — we'll always be upfront about what is and isn't included on your quote before you book.</p>
        </details>

        <details class="faq-item">
          <summary>What's the difference between the limousine and the party bus?<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></summary>
          <p>The stretch limousine seats around 8–10 and suits quieter, more formal occasions — weddings, proms, airport arrivals. The party bus seats 20–30+ with LED lighting and a bigger sound system, built for groups who want the night to start on the way there.</p>
        </details>

        <details class="faq-item">
          <summary>Do you provide car seats?<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></summary>
          <p>Let us know when you book and we'll do our best to accommodate — just give us a heads-up in advance so we can have it ready.</p>
        </details>

        <details class="faq-item">
          <summary>Can you pick us up from YVR or Abbotsford Airport?<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></summary>
          <p>Yes — airport transfers are one of our most requested services. We track your flight and adjust pickup timing automatically if it's delayed.</p>
        </details>

        <details class="faq-item">
          <summary>Is alcohol allowed onboard?<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></summary>
          <p>This depends on the event, vehicle and local regulations. Reach out when you book and we'll walk you through what's possible for your specific ride.</p>
        </details>

        <details class="faq-item">
          <summary>Do you travel to Whistler or Squamish?<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></summary>
          <p>Regularly. The Sea-to-Sky corridor is part of our core service area, whether that's a ski day, a resort weekend, or an event up the highway.</p>
        </details>

      </div>
    </div>
  </section>
